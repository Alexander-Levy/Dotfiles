[accessibility]
ui_scale = 1.2000000104308128

[bar]
order = [ "Levy" ]

    [bar.Levy]
    end = [ "power_profile", "brightness", "volume", "notifications" ]
    margin_edge = 3
    margin_ends = 5
    panel_overlap = 0
    radius = 16
    scale = 1.1000000089406967
    shadow = false
    start = [ "workspaces", "network", "bluetooth", "battery", "tray", "media" ]

[calendar]

[control_center]
hidden_tabs = [ "weather" ]
sidebar = "full"
width = 800

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 718.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_night = 4500

[shell]
font_family = "JetBrains Mono"

    [shell.launcher]
    categories = false

        [shell.launcher.providers.session]
        global = true

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/alex/Wallpapers"
transition = [ "disc", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/alex/Wallpapers/sunset.jpg"

    [wallpaper.last]
    path = "/home/alex/Wallpapers/sunset.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/alex/Wallpapers/sunset.jpg"

[widget.battery]
display_mode = "graphic"
hide_when_full = true

[widget.bluetooth]
color = "secondary"

[widget.brightness]
color = "primary"

[widget.clipboard]
color = "secondary"

[widget.clock]
format = "{:%I:%M %p}"

[widget.media]
hide_when_no_media = true

[widget.network]
color = "primary"
show_label = false

[widget.notifications]
color = "tertiary"

[widget.volume]
color = "secondary"

[widget.workspaces]
empty_color = "tertiary"
